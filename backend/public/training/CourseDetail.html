<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/ui.css">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500"><a href="./Courses.html">Courses</a> / <span style="color:#1c1a19;font-weight:700">{{ title }}</span></div>
      <sc-if value="{{ canEdit }}"><button onClick="{{ onEdit }}" style="padding:9px 16px;border:1px solid #e8e3e0;border-radius:8px;background:#fff;color:#1c1a19;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer">Edit course</button></sc-if>
    </header>
    <main style="flex:1;padding:28px 32px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start">
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;padding:22px">
        <div style="font-size:14px;font-weight:700;margin-bottom:4px">Lessons</div><div style="font-size:12px;color:#6b6660;margin-bottom:12px">{{ lessonHint }}</div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{ lessons }}" as="lesson" hint-placeholder-count="6">
            <div onClick="{{ lesson.onComplete }}" style="{{ lesson.rowStyle }}">
              <span style="{{ lesson.iconStyle }}">{{ lesson.icon }}</span>
              <div style="flex:1">
                <div style="font-size:13.5px;font-weight:600">{{ lesson.title }}</div>
                <div style="font-size:11.5px;color:#6b6660">{{ lesson.duration }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;padding:22px">
          <div style="font-size:14px;font-weight:700;margin-bottom:14px">Completion by agent</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{ agentsProgress }}" as="a" hint-placeholder-count="5">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
                <span>{{ a.name }}</span>
                <span style="{{ a.badge }}">{{ a.status }}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], course: null };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.forms = await import('../assets/forms.js');
    const shell = await this.app.shell('courses', ['admin', 'hr', 'branch_manager', 'agent']);
    const nav = await import('../shell/nav-config.js');
    if (shell.me.role === 'agent') shell.navSections = nav.decorateNav('agent', 'training');
    if (shell.me.role === 'hr') shell.navSections = nav.decorateNav('hr', 'training');
    this.setState(shell);
    this.load();
  }

  load = async () => {
    const id = this.app.param('id');
    if (!id) { location.replace('./Courses.html'); return; }
    const course = await this.app.run(() => this.app.api('/courses/' + id));
    if (course) this.setState({ course });
  };

  complete = async (lesson) => {
    if (lesson.done || !this.state.me.staff_id) return;
    const course = await this.app.run(() => this.app.api('/lessons/' + lesson.id + '/complete', { method: 'PUT' }), 'Lesson completed');
    if (course) this.setState({ course });
  };

  onEdit = async () => { if (await this.forms.courseForm(this.state.course)) { this.app.toast('Course saved'); this.load(); } };

  renderVals() {
    const app = this.app;
    const s = this.state;
    const c = s.course;
    const canLearn = !!(s.me && s.me.staff_id);
    const base = { ...(app ? app.shellVals(s) : {}), onEdit: this.onEdit, canEdit: !!(s.me && ['admin', 'hr'].includes(s.me.role)) };
    if (!app || !c) return { ...base, title: '', lessons: [], agentsProgress: [], lessonHint: '' };
    const icon = (done) => ({ width: 24, height: 24, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#fff', background: done ? '#2f7d5a' : '#d8d2cd', flexShrink: 0 });
    const done = c.lessons.filter((l) => l.done).length;
    return {
      ...base,
      title: c.title,
      lessonHint: canLearn ? `Your progress: ${done} of ${c.lessons.length} — click a lesson when you've completed it.` : `${c.lessons.length} lessons · ${c.duration}`,
      lessons: c.lessons.map((l, i) => ({
        title: l.title, duration: l.duration, icon: l.done ? '✓' : String(i + 1), iconStyle: icon(l.done),
        rowStyle: { display: 'flex', alignItems: 'center', gap: 12, padding: '12px 10px', borderRadius: 8, cursor: canLearn && !l.done ? 'pointer' : 'default' },
        onComplete: () => this.complete(l),
      })),
      agentsProgress: c.agents.map((a) => {
        const label = a.status === 'in_progress' ? `In progress (${a.lessons_done}/${a.lessons_total})` : app.status('course', a.status).label;
        return { name: a.name, status: label, badge: app.status('course', a.status, { fontSize: 11, padding: '3px 9px' }).style };
      }),
    };
  }
}
</script>
</body>
</html>
