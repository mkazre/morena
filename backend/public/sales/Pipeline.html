<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7a1528">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
  <style>
    body{margin:0}
    a{color:#7a1528;text-decoration:none}
    a:hover{color:#561020}
    ::-webkit-scrollbar{height:8px;width:8px}
    ::-webkit-scrollbar-thumb{background:#e8e3e0;border-radius:4px}
  </style>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)">
      <img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" />
    </div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}">
              <span style="{{ item.iconStyle }}">{{ item.icon }}</span>
              {{ item.label }}
            </a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div>
      </div>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">Sales / <span style="color:#1c1a19;font-weight:700">Pipeline Board</span></div>
      <div style="display:flex;align-items:center;gap:12px">
        <a href="./PipelineSettings.html" style="font-size:13px;font-weight:600;border:1px solid #e8e3e0;padding:8px 14px;border-radius:8px"><span class="i i-settings"></span> Edit stages</a>
        <button onClick="{{ onNewDeal }}" style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ New deal</button>
      </div>
    </header>

    <main style="flex:1;padding:24px 28px;overflow-x:auto;overflow-y:hidden">
      <div style="display:flex;gap:16px;height:100%;min-width:max-content">
        <sc-for list="{{ stages }}" as="stage" hint-placeholder-count="6">
          <div style="width:280px;flex-shrink:0;display:flex;flex-direction:column">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px">
              <div style="display:flex;align-items:center;gap:8px">
                <span style="{{ stage.dotStyle }}"></span>
                <span style="font-size:13.5px;font-weight:700">{{ stage.name }}</span>
              </div>
              <span style="font-size:12px;color:#6b6660;font-weight:600">{{ stage.count }}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:12px">
              <sc-for list="{{ stage.deals }}" as="deal" hint-placeholder-count="2">
                <div onClick="{{ deal.onOpen }}" style="background:#fff;border:1px solid #e8e3e0;border-radius:12px;padding:14px;cursor:pointer">
                  <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">{{ deal.property }}</div>
                  <div style="font-size:12px;color:#6b6660;margin-bottom:10px">{{ deal.agent }}</div>
                  <div style="display:flex;align-items:center;justify-content:space-between">
                    <span style="font-size:14px;font-weight:700;color:#7a1528">R{{ deal.value }}</span>
                    <span style="font-size:11px;color:#6b6660">{{ deal.days }}d in stage</span>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], stages: [], deals: [] };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.forms = await import('../assets/forms.js');
    this.setState(await this.app.shell('pipeline', ['admin', 'branch_manager', 'agent']));
    this.load();
  }

  load = async () => {
    const [stages, deals] = await Promise.all([
      this.app.api('/pipeline-stages'),
      this.app.api('/deals?status=open&per_page=200'),
    ]);
    this.setState({ stages: stages.data, deals: deals.data });
    // Export menu: the board has no table, so hand the deals over directly.
    window.__morenaExport = () => [{ title: 'Pipeline', columns: ['Property', 'Stage', 'Agent', 'Value (R)', 'Expected close'],
      rows: this.state.deals.map((d) => [d.property, d.stage || '', d.agent || '', Number(d.value || 0).toFixed(2), d.expected_close_date || '']) }];
  };

  onNewDeal = async () => {
    const saved = await this.forms.dealForm();
    if (saved) { this.app.toast('Deal created'); this.load(); }
  };

  renderVals() {
    const app = this.app;
    const s = this.state;
    const dot = (color) => ({ width: 9, height: 9, borderRadius: '50%', background: color });
    const stages = app ? s.stages.map((st) => {
      const deals = s.deals.filter((d) => d.stage_id === st.id).map((d) => ({
        property: d.property, agent: d.agent || '—', value: app.money(d.value), days: d.days_in_stage ?? 0,
        onOpen: () => { location.href = (s.me && s.me.role === 'agent' ? '../sales/DealDetail.html' : './DealDetail.html') + '?id=' + d.id; },
      }));
      return { name: st.name, dotStyle: dot(st.color_hex), count: deals.length, deals };
    }) : [];
    return { ...(app ? app.shellVals(s) : {}), stages, onNewDeal: this.onNewDeal };
  }
}
</script>
</body>
</html>
