<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">People / <span style="color:#1c1a19;font-weight:700">Staff Directory</span></div>
      <button onClick="{{ onNew }}" style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ Add staff member</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="display:flex;gap:10px;margin-bottom:18px">
        <input type="text" value="{{ search }}" onChange="{{ onSearch }}" placeholder="Search staff…" style="flex:1;max-width:320px;padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px" />
        <select value="{{ dept }}" onChange="{{ onDept }}" style="padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px;background:#fff"><option value="">All departments</option><option value="sales">Sales</option><option value="hr">HR</option><option value="admin">Admin</option><option value="finance">Finance</option></select>
        <select value="{{ branch }}" onChange="{{ onBranch }}" style="padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px;background:#fff"><option value="">All branches</option><sc-for list="{{ branchOptions }}" as="o"><option value="{{ o.value }}">{{ o.label }}</option></sc-for></select>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px">
        <sc-for list="{{ staff }}" as="person" hint-placeholder-count="8">
          <a href="{{ person.href }}" style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;padding:18px;display:block">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
              <div style="width:42px;height:42px;border-radius:50%;background:#f1ede9;color:#7a1528;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">{{ person.initials }}</div>
              <div style="min-width:0">
                <div style="font-size:14px;font-weight:700;color:#1c1a19">{{ person.name }}</div>
                <div style="font-size:12px;color:#6b6660">{{ person.role }}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:12px">
              <span style="color:#6b6660">{{ person.branch }}</span>
              <span style="{{ person.badge }}">{{ person.status }}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], staff: [], branchOptions: [], search: '', dept: '', branch: '' };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.forms = await import('../assets/forms.js');
    this.setState(await this.app.shell('staff', ['admin', 'hr', 'branch_manager']));
    this.setState({ branchOptions: await this.app.options('branches') });
    this.load();
  }

  load = async () => {
    const s = this.state;
    const q = new URLSearchParams({ per_page: 200 });
    if (s.search) q.set('search', s.search);
    if (s.dept) q.set('department', s.dept);
    if (s.branch) q.set('branch_id', s.branch);
    const seq = (this.seq = (this.seq || 0) + 1);
    const res = await this.app.run(() => this.app.api('/staff?' + q));
    if (res && seq === this.seq) this.setState({ staff: res.data });
  };

  onSearch = (e) => { this.setState({ search: e.target.value }); clearTimeout(this.t); this.t = setTimeout(this.load, 250); };
  onDept = (e) => this.setState({ dept: e.target.value }, this.load);
  onBranch = (e) => this.setState({ branch: e.target.value }, this.load);
  onNew = async () => {
    if (!['admin', 'hr'].includes(this.state.me.role)) { this.app.toast('Only HR can add staff members.', 'warn'); return; }
    if (await this.forms.staffForm()) { this.app.toast('Staff member added — invite emailed'); this.load(); }
  };

  renderVals() {
    const app = this.app;
    const s = this.state;
    const staff = app ? s.staff.map((p) => {
      const st = app.status('staff', p.status, { fontSize: 11, padding: '3px 9px' });
      return { href: './StaffProfile.html?id=' + p.id, initials: p.initials, name: p.name, role: p.role_title, branch: p.branch || '—', status: st.label, badge: st.style };
    }) : [];
    return {
      ...(app ? app.shellVals(s) : {}), staff, branchOptions: s.branchOptions,
      search: s.search, dept: s.dept, branch: s.branch,
      onSearch: this.onSearch, onDept: this.onDept, onBranch: this.onBranch, onNew: this.onNew,
    };
  }
}
</script>
</body>
</html>
