<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">People / <span style="color:#1c1a19;font-weight:700">Contracts</span></div>
      <button onClick="{{ onNew }}" style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ New contract</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
            <th style="padding:12px 20px;font-weight:600">Staff member</th><th style="padding:12px 0;font-weight:600">Contract type</th><th style="padding:12px 0;font-weight:600">Start date</th><th style="padding:12px 0;font-weight:600">Renewal / expiry</th><th style="padding:12px 0;font-weight:600">Status</th><th style="padding:12px 20px;font-weight:600"></th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ contracts }}" as="c" hint-placeholder-count="6">
              <tr style="border-top:1px solid #f1ede9">
                <td onClick="{{ c.onEdit }}" style="padding:14px 20px;font-weight:700;cursor:pointer">{{ c.name }}</td>
                <td style="padding:14px 0;color:#6b6660">{{ c.type }}</td>
                <td style="padding:14px 0;color:#6b6660">{{ c.start }}</td>
                <td style="padding:14px 0;color:#6b6660">{{ c.expiry }}</td>
                <td style="padding:14px 0"><span style="{{ c.badge }}">{{ c.status }}</span></td>
                <td style="padding:14px 20px"><a href="{{ c.url }}" onClick="{{ c.onLink }}" style="font-weight:600;font-size:12.5px">{{ c.linkLabel }}</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], contracts: [] };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.forms = await import('../assets/forms.js');
    this.setState(await this.app.shell('contracts', ['admin', 'hr']));
    this.load();
  }

  load = async () => {
    const res = await this.app.run(() => this.app.api('/contracts'));
    if (res) this.setState({ contracts: res.data });
  };

  onNew = async () => { if (await this.forms.contractForm()) { this.app.toast('Contract added'); this.load(); } };

  renderVals() {
    const app = this.app;
    const s = this.state;
    const contracts = app ? s.contracts.map((c) => {
      const st = app.status('contract', c.status);
      const edit = async () => { if (await this.forms.contractForm(c)) { app.toast('Contract saved'); this.load(); } };
      return {
        name: c.name, type: c.type, start: app.date(c.start_date),
        expiry: c.expiry_date ? app.date(c.expiry_date) : c.type.includes('Independent') ? 'Ongoing' : '—',
        status: st.label, badge: st.style, onEdit: edit,
        url: c.has_file ? '/api/v1/contracts/' + c.id + '/download' : '#',
        linkLabel: c.has_file ? 'View PDF' : 'Upload PDF',
        onLink: c.has_file ? undefined : (e) => { e.preventDefault(); edit(); },
      };
    }) : [];
    return { ...(app ? app.shellVals(s) : {}), contracts, onNew: this.onNew };
  }
}
</script>
</body>
</html>
