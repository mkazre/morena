<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7a1528">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">People / <span style="color:#1c1a19;font-weight:700">Onboarding</span></div>
      <button onClick="{{ onNew }}" style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ Start onboarding</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <sc-if value="{{ noHires }}"><div style="font-size:13px;color:#6b6660">No one is onboarding right now.</div></sc-if>
        <sc-for list="{{ hires }}" as="hire" hint-placeholder-count="3">
          <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;padding:20px 22px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
              <div>
                <div style="font-size:14.5px;font-weight:700">{{ hire.name }}</div>
                <div style="font-size:12.5px;color:#6b6660">{{ hire.role }} · Starts {{ hire.startDate }}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:13px;font-weight:700">{{ hire.pct }}% complete</div>
              </div>
            </div>
            <div style="height:8px;border-radius:4px;background:#f1ede9;margin-bottom:14px">
              <div style="{{ hire.barStyle }}"></div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{ hire.tasks }}" as="task" hint-placeholder-count="5">
                <span onClick="{{ task.onToggle }}" title="Click to toggle" style="{{ task.badge }}">{{ task.icon }} {{ task.label }}</span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], hires: [], loaded: false };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.forms = await import('../assets/forms.js');
    this.setState(await this.app.shell('onboarding', ['admin', 'hr']));
    this.load();
  }

  load = async () => {
    const res = await this.app.run(() => this.app.api('/onboarding'));
    if (res) this.setState({ hires: res.data, loaded: true });
  };

  toggle = async (hireIdx, task) => {
    const updated = await this.app.run(() => this.app.api('/onboarding-tasks/' + task.id, { method: 'PUT', body: { is_done: !task.is_done } }));
    if (updated) this.setState({ hires: this.state.hires.map((h, i) => (i === hireIdx ? updated : h)) });
  };

  onNew = async () => { if (await this.forms.onboardingForm()) { this.app.toast('Onboarding started'); this.load(); } };

  renderVals() {
    const app = this.app;
    const s = this.state;
    const badge = (done) => ({ fontSize: 12, fontWeight: 600, padding: '6px 12px', borderRadius: 999, background: done ? '#eaf3ee' : '#f1ede9', color: done ? '#2f7d5a' : '#6b6660', cursor: 'pointer' });
    return {
      ...(app ? app.shellVals(s) : {}), onNew: this.onNew, noHires: s.loaded && !s.hires.length,
      hires: app ? s.hires.map((h, i) => ({
        name: h.name, role: h.role, startDate: app.date(h.start_date), pct: h.pct, barStyle: app.bar(h.pct),
        tasks: h.tasks.map((t) => ({ label: t.label, icon: t.is_done ? '✓' : '○', badge: badge(t.is_done), onToggle: () => this.toggle(i, t) })),
      })) : [],
    };
  }
}
</script>
</body>
</html>
