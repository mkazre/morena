<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/ui.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#7a1528">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="2">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="8">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">My Workspace / <span style="color:#1c1a19;font-weight:700">My Documents</span></div>
    </header>
    <main style="flex:1;padding:28px 32px">
      <p style="font-size:13.5px;color:#6b6660;max-width:600px;margin:0 0 18px">Always the latest templates — pulled live from the Document Library.</p>
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
            <th style="padding:12px 20px;font-weight:600">Document</th><th style="padding:12px 0;font-weight:600">Linked to</th><th style="padding:12px 0;font-weight:600">Version</th><th style="padding:12px 20px;font-weight:600"></th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ files }}" as="f" hint-placeholder-count="6">
              <tr style="border-top:1px solid #f1ede9">
                <td style="padding:13px 20px;font-weight:700">{{ f.name }}</td>
                <td style="padding:13px 0;color:#6b6660">{{ f.linkedTo }}</td>
                <td style="padding:13px 0">v{{ f.version }}</td>
                <td style="padding:13px 20px"><a href="{{ f.url }}" style="font-weight:600;font-size:12.5px">Download</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], templates: [], docs: [] };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.setState(await this.app.shell('documents', ['agent']));
    const [templates, docs] = await Promise.all([this.app.api('/document-templates'), this.app.api('/documents?per_page=100')]);
    this.setState({ templates: templates.data, docs: docs.data });
  }

  renderVals() {
    const app = this.app;
    const s = this.state;
    // Current template versions first (always the latest — never an old WhatsApp copy), then my files.
    const files = [
      ...s.templates.map((t) => ({ name: t.name + ' template', linkedTo: 'Template library', version: t.version, url: t.download_url })),
      ...s.docs.map((d) => ({ name: d.name, linkedTo: d.linked_to, version: d.version, url: d.download_url })),
    ];
    return { ...(app ? app.shellVals(s) : {}), files };
  }
}
</script>
</body>
</html>
