<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/ui.css">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="2">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="8">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ userInitials }}</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">{{ userName }}</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }} · <a href="#" onClick="{{ onSignOut }}" style="color:rgba(255,255,255,0.5);text-decoration:underline">Sign out</a></div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">My Workspace / <span style="color:#1c1a19;font-weight:700">My Leads</span></div>
      <button onClick="{{ onNew }}" style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ Add lead</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
            <th style="padding:12px 20px;font-weight:600">Lead</th><th style="padding:12px 0;font-weight:600">Interested in</th><th style="padding:12px 0;font-weight:600">Source</th><th style="padding:12px 0;font-weight:600">Status</th><th style="padding:12px 20px;font-weight:600">Added</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ leads }}" as="lead" hint-placeholder-count="4">
              <tr style="border-top:1px solid #f1ede9">
                <td style="padding:14px 20px;cursor:pointer" onClick="{{ lead.onEdit }}"><div style="font-weight:700">{{ lead.name }}</div><div style="font-size:12px;color:#6b6660">{{ lead.phone }}</div></td>
                <td style="padding:14px 0;color:#6b6660">{{ lead.interest }}</td>
                <td style="padding:14px 0;color:#6b6660">{{ lead.source }}</td>
                <td style="padding:14px 0"><span style="{{ lead.badge }}">{{ lead.status }}</span></td>
                <td style="padding:14px 20px;color:#6b6660">{{ lead.added }}<sc-if value="{{ lead.canConvert }}"> · <a href="#" onClick="{{ lead.onConvert }}" style="font-weight:600;font-size:12.5px">Convert →</a></sc-if></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [], leads: [] };

  async componentDidMount() {
    this.app = await import('../assets/app.js');
    this.forms = await import('../assets/forms.js');
    this.setState(await this.app.shell('leads', ['agent']));
    this.load();
  }

  load = async () => {
    const res = await this.app.run(() => this.app.api('/leads?per_page=200'));
    if (res) this.setState({ leads: res.data.filter((l) => l.status !== 'lost' || Date.now() - new Date(l.created_at) < 90 * 864e5) });
  };

  onNew = async () => { if (await this.forms.leadForm()) { this.app.toast('Lead added'); this.load(); } };

  renderVals() {
    const app = this.app;
    const s = this.state;
    return {
      ...(app ? app.shellVals(s) : {}), onNew: this.onNew,
      leads: app ? s.leads.map((l) => {
        const st = app.status('lead', l.status);
        return {
          name: l.name, phone: l.phone || '', interest: l.interest || '—', source: l.source_label, status: st.label, badge: st.style, added: app.ago(l.created_at),
          canConvert: !['converted', 'lost'].includes(l.status),
          onEdit: async () => { if (await this.forms.leadForm(l)) { app.toast('Lead saved'); this.load(); } },
          onConvert: async (e) => {
            e.preventDefault();
            const deal = await this.forms.convertLeadForm(l);
            if (deal) location.href = '../sales/DealDetail.html?id=' + deal.data.id;
          },
        };
      }) : [],
    };
  }
}
</script>
</body>
</html>
