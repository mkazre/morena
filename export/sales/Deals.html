<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">TM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Thandiwe Morena</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">Sales / <span style="color:#1c1a19;font-weight:700">All Deals</span></div>
      <a href="./Pipeline.html" style="font-size:13px;font-weight:600">View as board →</a>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="display:flex;gap:10px;margin-bottom:18px">
        <input type="text" placeholder="Search by property or agent…" style="flex:1;max-width:320px;padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px" />
        <select style="padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px;background:#fff"><option>All stages</option></select>
        <select style="padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px;background:#fff"><option>All agents</option></select>
      </div>
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
            <th style="padding:12px 20px;font-weight:600">Property</th><th style="padding:12px 0;font-weight:600">Agent</th><th style="padding:12px 0;font-weight:600">Stage</th><th style="padding:12px 0;font-weight:600;text-align:right">Value</th><th style="padding:12px 0;font-weight:600;text-align:right">Est. commission</th><th style="padding:12px 20px;font-weight:600">Expected close</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ deals }}" as="deal" hint-placeholder-count="8">
              <tr style="border-top:1px solid #f1ede9;cursor:pointer">
                <td style="padding:14px 20px"><a href="./DealDetail.html" style="font-weight:700;color:#1c1a19">{{ deal.property }}</a></td>
                <td style="padding:14px 0;color:#6b6660">{{ deal.agent }}</td>
                <td style="padding:14px 0"><span style="{{ deal.stageBadge }}">{{ deal.stage }}</span></td>
                <td style="padding:14px 0;text-align:right;font-weight:700">R{{ deal.value }}</td>
                <td style="padding:14px 0;text-align:right;color:#6b6660">R{{ deal.commission }}</td>
                <td style="padding:14px 20px;color:#6b6660">{{ deal.closeDate }}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('admin', 'deals'), roleLabel: mod.roleLabels.admin });
  }
  renderVals() {
    const badge = (bg, color) => ({ fontSize: 11.5, fontWeight: 700, padding: '3px 10px', borderRadius: 999, background: bg, color });
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      deals: [
        { property: '14 Rivonia Views', agent: 'Naledi Mokoena', stage: 'Offer Accepted', stageBadge: badge('#f1ede9', '#7a1528'), value: '2,450,000', commission: '147,000', closeDate: '30 Oct 2026' },
        { property: 'Unit 6, Oakfield Estate', agent: 'Sipho Khumalo', stage: 'Bond Approved', stageBadge: badge('#eaf3ee', '#2f7d5a'), value: '1,890,000', commission: '113,400', closeDate: '12 Nov 2026' },
        { property: '22 Sandton Heights', agent: 'Riaan Pretorius', stage: 'Registration', stageBadge: badge('#f5e9ea', '#561020'), value: '5,200,000', commission: '312,000', closeDate: '18 Oct 2026' },
        { property: '8 Melrose Close', agent: 'Lerato Dlamini', stage: 'Viewing Scheduled', stageBadge: badge('#f6eef0', '#c23552'), value: '990,000', commission: '59,400', closeDate: '5 Dec 2026' },
        { property: '41 Bryanston Road', agent: 'Sipho Khumalo', stage: 'Offer Made', stageBadge: badge('#f6eef0', '#c23552'), value: '3,400,000', commission: '204,000', closeDate: '22 Nov 2026' },
        { property: '12 Umhlanga Ridge', agent: 'Riaan Pretorius', stage: 'FICA / Due Diligence', stageBadge: badge('#f3e6e9', '#a3233f'), value: '4,100,000', commission: '246,000', closeDate: '8 Nov 2026' },
        { property: '19 Parkview Lane', agent: 'Naledi Mokoena', stage: 'Viewing Scheduled', stageBadge: badge('#f6eef0', '#c23552'), value: '2,100,000', commission: '126,000', closeDate: '1 Dec 2026' },
        { property: '3 Fourways Gardens', agent: 'Johan van der Merwe', stage: 'Lead', stageBadge: badge('#f1ede9', '#6b6660'), value: '1,350,000', commission: '81,000', closeDate: 'TBC' },
      ],
    };
  }
}
</script>
</body>
</html>
