<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
  <script src="../image-slot.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">TM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Thandiwe Morena</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">Sales / <span style="color:#1c1a19;font-weight:700">Listings</span></div>
      <button style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ New listing</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px">
        <sc-for list="{{ listings }}" as="item" hint-placeholder-count="8">
          <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
            <image-slot id="{{ item.imgId }}" style="width:100%;height:160px" shape="rect" placeholder="Property photo"></image-slot>
            <div style="padding:16px">
              <div style="display:flex;align-items:start;justify-content:space-between;margin-bottom:6px">
                <div style="font-size:14.5px;font-weight:700;line-height:1.3">{{ item.title }}</div>
                <span style="{{ item.statusBadge }}">{{ item.status }}</span>
              </div>
              <div style="font-size:12.5px;color:#6b6660;margin-bottom:10px">{{ item.suburb }}</div>
              <div style="font-size:17px;font-weight:700;color:#7a1528;margin-bottom:8px">R{{ item.price }}</div>
              <div style="font-size:12px;color:#6b6660">{{ item.agent }} · {{ item.beds }} bed · {{ item.baths }} bath</div>
            </div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('admin', 'listings'), roleLabel: mod.roleLabels.admin });
  }
  renderVals() {
    const badge = (bg, color) => ({ fontSize: 11, fontWeight: 700, padding: '3px 9px', borderRadius: 999, background: bg, color, flexShrink: 0 });
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      listings: [
        { imgId: 'listing-1', title: '14 Rivonia Views', suburb: 'Rivonia, Sandton', price: '2,450,000', status: 'Under Offer', statusBadge: badge('#f1ede9', '#7a1528'), agent: 'Naledi Mokoena', beds: 3, baths: 2 },
        { imgId: 'listing-2', title: 'Unit 6, Oakfield Estate', suburb: 'Oakfield, Midrand', price: '1,890,000', status: 'Active', statusBadge: badge('#eaf3ee', '#2f7d5a'), agent: 'Sipho Khumalo', beds: 2, baths: 1 },
        { imgId: 'listing-3', title: '22 Sandton Heights', suburb: 'Sandton CBD', price: '5,200,000', status: 'Sold', statusBadge: badge('#f1ede9', '#6b6660'), agent: 'Riaan Pretorius', beds: 4, baths: 3 },
        { imgId: 'listing-4', title: '8 Melrose Close', suburb: 'Melrose, Johannesburg', price: '990,000', status: 'Active', statusBadge: badge('#eaf3ee', '#2f7d5a'), agent: 'Lerato Dlamini', beds: 2, baths: 1 },
        { imgId: 'listing-5', title: '41 Bryanston Road', suburb: 'Bryanston', price: '3,400,000', status: 'Active', statusBadge: badge('#eaf3ee', '#2f7d5a'), agent: 'Sipho Khumalo', beds: 4, baths: 3 },
        { imgId: 'listing-6', title: '3 Fourways Gardens', suburb: 'Fourways', price: '1,350,000', status: 'Active', statusBadge: badge('#eaf3ee', '#2f7d5a'), agent: 'Johan van der Merwe', beds: 3, baths: 2 },
      ],
    };
  }
}
</script>
</body>
</html>
