<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">TM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Thandiwe Morena</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">Documents / <span style="color:#1c1a19;font-weight:700">Library</span></div>
      <button style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ Upload document</button>
    </header>
    <main style="flex:1;padding:28px 32px;overflow-y:auto;min-height:0">
      <div style="display:flex;gap:16px">
        <div style="width:200px;flex-shrink:0">
          <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#6b6660;margin-bottom:10px">Categories</div>
          <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="6">
            <div style="{{ cat.rowStyle }}">{{ cat.name }} <span style="color:#6b6660;font-weight:500">{{ cat.count }}</span></div>
          </sc-for>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:10px;margin-bottom:16px">
            <input type="text" placeholder="Search documents, property, client…" style="flex:1;padding:9px 14px;border:1px solid #e8e3e0;border-radius:8px;font-family:inherit;font-size:13px" />
          </div>
          <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
                <th style="padding:12px 20px;font-weight:600">Document</th><th style="padding:12px 0;font-weight:600">Category</th><th style="padding:12px 0;font-weight:600">Linked to</th><th style="padding:12px 0;font-weight:600">Version</th><th style="padding:12px 0;font-weight:600">Uploaded</th><th style="padding:12px 20px;font-weight:600"></th>
              </tr></thead>
              <tbody>
                <sc-for list="{{ files }}" as="f" hint-placeholder-count="8">
                  <tr style="border-top:1px solid #f1ede9">
                    <td style="padding:13px 20px;font-weight:700">{{ f.name }}</td>
                    <td style="padding:13px 0;color:#6b6660">{{ f.category }}</td>
                    <td style="padding:13px 0;color:#6b6660">{{ f.linkedTo }}</td>
                    <td style="padding:13px 0"><span style="{{ f.versionBadge }}">v{{ f.version }}</span></td>
                    <td style="padding:13px 0;color:#6b6660">{{ f.uploaded }}</td>
                    <td style="padding:13px 20px"><a href="#" style="font-weight:600;font-size:12.5px">Open</a></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('admin', 'doc-library'), roleLabel: mod.roleLabels.admin });
  }
  renderVals() {
    const catRow = (active) => ({ display: 'flex', justifyContent: 'space-between', fontSize: 13, fontWeight: active ? 700 : 500, padding: '8px 10px', borderRadius: 8, background: active ? '#f1ede9' : 'transparent', color: '#1c1a19', marginBottom: 2, cursor: 'pointer' });
    const vBadge = (c) => ({ fontSize: 11.5, fontWeight: 700, padding: '2px 8px', borderRadius: 999, background: '#f1ede9', color: c });
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      categories: [
        { name: 'All documents', count: 214, rowStyle: catRow(true) },
        { name: 'Offers to Purchase', count: 42, rowStyle: catRow(false) },
        { name: 'Lease Agreements', count: 56, rowStyle: catRow(false) },
        { name: 'FICA / Compliance', count: 88, rowStyle: catRow(false) },
        { name: 'Mandates', count: 19, rowStyle: catRow(false) },
        { name: 'Commission Invoices', count: 9, rowStyle: catRow(false) },
      ],
      files: [
        { name: 'OTP — 14 Rivonia Views.pdf', category: 'Offers to Purchase', linkedTo: 'Deal: 14 Rivonia Views', version: 2, versionBadge: vBadge('#7a1528'), uploaded: 'Yesterday' },
        { name: 'FICA Pack — P. Nkosi.pdf', category: 'FICA / Compliance', linkedTo: 'Client: Precious Nkosi', version: 1, versionBadge: vBadge('#6b6660'), uploaded: '2 days ago' },
        { name: 'Sole Mandate — 8 Melrose Close.pdf', category: 'Mandates', linkedTo: 'Listing: 8 Melrose Close', version: 1, versionBadge: vBadge('#6b6660'), uploaded: '4 days ago' },
        { name: 'Lease — Unit 12 Oakfield.pdf', category: 'Lease Agreements', linkedTo: 'Tenant: R. Dube', version: 3, versionBadge: vBadge('#7a1528'), uploaded: '1 week ago' },
        { name: 'Commission Invoice — Oct 2026.pdf', category: 'Commission Invoices', linkedTo: 'Agent: Riaan Pretorius', version: 1, versionBadge: vBadge('#6b6660'), uploaded: '1 week ago' },
        { name: 'FICA Pack — D. Botha.pdf', category: 'FICA / Compliance', linkedTo: 'Client: David Botha', version: 1, versionBadge: vBadge('#6b6660'), uploaded: '2 weeks ago' },
      ],
    };
  }
}
</script>
</body>
</html>
