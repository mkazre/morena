<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">TM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Thandiwe Morena</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">People / <span style="color:#1c1a19;font-weight:700">Onboarding</span></div>
      <button style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ Start onboarding</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="display:flex;flex-direction:column;gap:16px">
        <sc-for list="{{ hires }}" as="hire" hint-placeholder-count="3">
          <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;padding:20px 22px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
              <div>
                <div style="font-size:14.5px;font-weight:700">{{ hire.name }}</div>
                <div style="font-size:12.5px;color:#6b6660">{{ hire.role }} · Starts {{ hire.startDate }}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:13px;font-weight:700">{{ hire.pct }}% complete</div>
              </div>
            </div>
            <div style="height:8px;border-radius:4px;background:#f1ede9;margin-bottom:14px">
              <div style="{{ hire.barStyle }}"></div>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <sc-for list="{{ hire.tasks }}" as="task" hint-placeholder-count="5">
                <span style="{{ task.badge }}">{{ task.icon }} {{ task.label }}</span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('admin', 'onboarding'), roleLabel: mod.roleLabels.admin });
  }
  renderVals() {
    const badge = (done) => ({ fontSize: 12, fontWeight: 600, padding: '6px 12px', borderRadius: 999, background: done ? '#eaf3ee' : '#f1ede9', color: done ? '#2f7d5a' : '#6b6660' });
    const bar = (pct) => ({ width: pct + '%', height: '100%', borderRadius: 4, background: '#7a1528' });
    const taskList = (done) => [
      { label: 'Contract signed', icon: '✓', badge: badge(done[0]) },
      { label: 'FICA documents', icon: '✓', badge: badge(done[1]) },
      { label: 'FFC registration', icon: '✓', badge: badge(done[2]) },
      { label: 'System access granted', icon: '✓', badge: badge(done[3]) },
      { label: 'Induction training', icon: '✓', badge: badge(done[4]) },
    ];
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      hires: [
        { name: 'Johan van der Merwe', role: 'Junior Sales Agent', startDate: '2 Sept 2026', pct: 80, barStyle: bar(80), tasks: taskList([true, true, true, true, false]) },
        { name: 'Palesa Mahlangu', role: 'Sales Agent', startDate: '13 Oct 2026', pct: 40, barStyle: bar(40), tasks: taskList([true, true, false, false, false]) },
        { name: 'Thabo Nkosi', role: 'Admin Assistant', startDate: '20 Oct 2026', pct: 20, barStyle: bar(20), tasks: taskList([true, false, false, false, false]) },
      ],
    };
  }
}
</script>
</body>
</html>
