<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="5">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="3">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">TM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Thandiwe Morena</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">Training / <span style="color:#1c1a19;font-weight:700">Courses</span></div>
      <button style="padding:9px 16px;border:none;border-radius:8px;background:#7a1528;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">+ New course</button>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px">
        <sc-for list="{{ courses }}" as="course" hint-placeholder-count="6">
          <a href="./CourseDetail.html" style="display:block;background:#fff;border:1px solid #e8e3e0;border-radius:14px;padding:20px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#7a1528;margin-bottom:8px">{{ course.category }}</div>
            <div style="font-size:15px;font-weight:700;color:#1c1a19;margin-bottom:8px;line-height:1.3">{{ course.title }}</div>
            <div style="font-size:12.5px;color:#6b6660;margin-bottom:14px">{{ course.lessons }} lessons · {{ course.duration }}</div>
            <div style="height:7px;border-radius:4px;background:#f1ede9;margin-bottom:8px"><div style="{{ course.barStyle }}"></div></div>
            <div style="font-size:12px;color:#6b6660">{{ course.completedCount }} of {{ course.totalAgents }} agents complete</div>
          </a>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('admin', 'courses'), roleLabel: mod.roleLabels.admin });
  }
  renderVals() {
    const bar = (pct) => ({ width: pct + '%', height: '100%', borderRadius: 4, background: '#7a1528' });
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      courses: [
        { category: 'Compliance', title: 'FICA & POPIA for Estate Agents', lessons: 6, duration: '1.5 hrs', completedCount: 9, totalAgents: 11, barStyle: bar(82) },
        { category: 'Sales Skills', title: 'Mastering the Offer to Purchase', lessons: 4, duration: '45 min', completedCount: 7, totalAgents: 11, barStyle: bar(64) },
        { category: 'Onboarding', title: 'New Agent Induction', lessons: 8, duration: '2 hrs', completedCount: 3, totalAgents: 3, barStyle: bar(100) },
        { category: 'Systems', title: 'Using the CRM Pipeline', lessons: 5, duration: '50 min', completedCount: 11, totalAgents: 11, barStyle: bar(100) },
        { category: 'Compliance', title: 'PPRA Code of Conduct Refresher', lessons: 3, duration: '40 min', completedCount: 5, totalAgents: 11, barStyle: bar(45) },
        { category: 'Sales Skills', title: 'Negotiation & Closing Techniques', lessons: 7, duration: '1.2 hrs', completedCount: 4, totalAgents: 11, barStyle: bar(36) },
      ],
    };
  }
}
</script>
</body>
</html>
