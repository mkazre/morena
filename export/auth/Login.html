<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0}
    a{color:#7a1528}
    a:hover{color:#561020}
  </style>
</helmet>
<div style="min-height:100vh;display:flex;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px">
    <div style="width:100%;max-width:380px">
      <img src="../assets/logo.png" alt="Morena Properties" style="width:220px;height:auto;margin-bottom:36px" />
      <div style="font-size:13px;font-weight:600;letter-spacing:0.04em;color:#6b6660;text-transform:uppercase;margin-bottom:8px">Welcome back</div>
      <h1 style="font-size:28px;font-weight:700;margin:0 0 28px;color:#1c1a19">Sign in to your workspace</h1>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div>
          <label style="display:block;font-size:13px;font-weight:600;color:#1c1a19;margin-bottom:6px">Email address</label>
          <input type="email" placeholder="you@morenaproperties.co.za" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e8e3e0;border-radius:10px;font-size:14px;font-family:inherit;outline:none" />
        </div>
        <div>
          <label style="display:block;font-size:13px;font-weight:600;color:#1c1a19;margin-bottom:6px">Password</label>
          <input type="password" placeholder="••••••••" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e8e3e0;border-radius:10px;font-size:14px;font-family:inherit;outline:none" />
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px">
          <label style="display:flex;align-items:center;gap:8px;color:#6b6660"><input type="checkbox" /> Remember me</label>
          <a href="#" style="text-decoration:none;font-weight:600">Forgot password?</a>
        </div>
        <button style="margin-top:8px;padding:13px;border:none;border-radius:10px;background:#7a1528;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer">Sign in</button>
        <div style="text-align:center;font-size:12px;color:#6b6660;margin-top:8px">Accounts are created by your administrator. Contact HR if you need access.</div>
      </div>
    </div>
  </div>
  <div style="flex:1;background:linear-gradient(160deg,#1c1a19,#3a1420 70%);position:relative;display:flex;align-items:flex-end;padding:56px;box-sizing:border-box">
    <div style="color:#fff;max-width:420px">
      <div style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#e2607e;margin-bottom:14px">People · Property · Passion</div>
      <div style="font-size:26px;font-weight:600;line-height:1.4">One system for sales, people, documents and training — everything your team needs, nothing on WhatsApp.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
