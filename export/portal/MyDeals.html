<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="2">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="8">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">NM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Naledi Mokoena</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">My Workspace / <span style="color:#1c1a19;font-weight:700">My Deals</span></div>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
            <th style="padding:12px 20px;font-weight:600">Property</th><th style="padding:12px 0;font-weight:600">Stage</th><th style="padding:12px 0;font-weight:600;text-align:right">Value</th><th style="padding:12px 0;font-weight:600;text-align:right">My commission</th><th style="padding:12px 20px;font-weight:600">Expected close</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ deals }}" as="deal" hint-placeholder-count="6">
              <tr style="border-top:1px solid #f1ede9">
                <td style="padding:14px 20px;font-weight:700">{{ deal.property }}</td>
                <td style="padding:14px 0"><span style="{{ deal.badge }}">{{ deal.stage }}</span></td>
                <td style="padding:14px 0;text-align:right">R{{ deal.value }}</td>
                <td style="padding:14px 0;text-align:right;font-weight:700;color:#7a1528">R{{ deal.commission }}</td>
                <td style="padding:14px 20px;color:#6b6660">{{ deal.closeDate }}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('agent', 'deals'), roleLabel: mod.roleLabels.agent });
  }
  renderVals() {
    const badge = (bg, color) => ({ fontSize: 11.5, fontWeight: 700, padding: '3px 10px', borderRadius: 999, background: bg, color });
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      deals: [
        { property: '14 Rivonia Views', stage: 'Offer Accepted', badge: badge('#f1ede9', '#7a1528'), value: '2,450,000', commission: '118,650', closeDate: '30 Oct 2026' },
        { property: '19 Parkview Lane', stage: 'Viewing Scheduled', badge: badge('#f6eef0', '#c23552'), value: '2,100,000', commission: '101,850', closeDate: '1 Dec 2026' },
        { property: '5 Bramley Gardens', stage: 'Lead', badge: badge('#f1ede9', '#6b6660'), value: '1,680,000', commission: '81,480', closeDate: 'TBC' },
      ],
    };
  }
}
</script>
</body>
</html>
