<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0} a{color:#7a1528;text-decoration:none} a:hover{color:#561020}</style>
  <script src="../assets/logo-scale.js"></script>
</helmet>
<div style="display:flex;min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;background:#faf8f6;color:#1c1a19">
  <aside style="width:240px;flex-shrink:0;background:#1c1a19;display:flex;flex-direction:column;position:sticky;top:0;height:100vh">
    <div style="padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08)"><img id="sidebarLogo" src="../assets/logo.png" alt="Morena Properties" style="width:170px;max-width:100%;height:auto;filter:brightness(0) invert(1)" /></div>
    <nav style="flex:1;padding:16px 12px;overflow-y:auto">
      <sc-for list="{{ navSections }}" as="section" hint-placeholder-count="2">
        <div style="margin-bottom:18px">
          <div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.38);padding:0 10px 6px">{{ section.title }}</div>
          <sc-for list="{{ section.items }}" as="item" hint-placeholder-count="4">
            <a href="{{ item.href }}" style="{{ item.rowStyle }}"><span style="{{ item.iconStyle }}">{{ item.icon }}</span>{{ item.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#7a1528;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">KM</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap">Kagiso Molefe</div><div style="font-size:11px;color:rgba(255,255,255,0.5)">{{ roleLabel }}</div></div>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:68px;flex-shrink:0;border-bottom:1px solid #e8e3e0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff">
      <div style="font-size:13px;color:#6b6660;font-weight:500">Branch / <span style="color:#1c1a19;font-weight:700">Team Performance</span></div>
    </header>
    <main style="flex:1;padding:28px 32px">
      <div style="background:#fff;border:1px solid #e8e3e0;border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:left;color:#6b6660;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;background:#faf8f6">
            <th style="padding:12px 20px;font-weight:600">Agent</th><th style="padding:12px 0;font-weight:600;text-align:right">Deals (YTD)</th><th style="padding:12px 0;font-weight:600;text-align:right">Commission (YTD)</th><th style="padding:12px 0;font-weight:600;text-align:right">Pipeline value</th><th style="padding:12px 20px;font-weight:600">Training</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ agents }}" as="a" hint-placeholder-count="4">
              <tr style="border-top:1px solid #f1ede9">
                <td style="padding:14px 20px;font-weight:700">{{ a.name }}</td>
                <td style="padding:14px 0;text-align:right">{{ a.deals }}</td>
                <td style="padding:14px 0;text-align:right">R{{ a.commission }}</td>
                <td style="padding:14px 0;text-align:right">R{{ a.pipeline }}</td>
                <td style="padding:14px 20px"><span style="{{ a.badge }}">{{ a.training }}</span></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { navSections: [] };
  async componentDidMount() {
    const mod = await import('../shell/nav-config.js');
    this.setState({ navSections: mod.decorateNav('manager', 'team'), roleLabel: mod.roleLabels.manager });
  }
  renderVals() {
    const badge = (bg, color) => ({ fontSize: 11.5, fontWeight: 700, padding: '3px 10px', borderRadius: 999, background: bg, color });
    return {
      navSections: this.state.navSections, roleLabel: this.state.roleLabel,
      agents: [
        { name: 'Riaan Pretorius', deals: 22, commission: '812,400', pipeline: '9,300,000', training: 'Up to date', badge: badge('#eaf3ee', '#2f7d5a') },
        { name: 'Johan van der Merwe', deals: 6, commission: '198,700', pipeline: '2,730,000', training: '1 pending', badge: badge('#fbf3e3', '#c07c1e') },
        { name: 'Palesa Mahlangu', deals: 3, commission: '84,200', pipeline: '4,110,000', training: 'In progress', badge: badge('#fbf3e3', '#c07c1e') },
        { name: 'Thabo Nkosi', deals: 0, commission: '0', pipeline: '2,480,000', training: 'Not started', badge: badge('#f5e9e9', '#b42318') },
      ],
    };
  }
}
</script>
</body>
</html>
